<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 та 3</title>
    <style>
        .calc { width: 260px; padding: 10px; border: 2px solid #333; border-radius: 8px; }
        .display { width: 95%; height: 35px; font-size: 18px; text-align: right; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .eng-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
        button { height: 40px; font-size: 16px; cursor: pointer; }
        .toggle-btn { width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h3>Калькулятор (Простий / Інженерний)</h3>
    <div class="calc">
        <button id="toggleMode" class="toggle-btn">Переключити на Інженерний</button>
        <input type="text" id="display" class="display" readonly>
        
        <div class="grid">
            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button onclick="clearDisplay()">C</button>
            
            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button onclick="appendOp('/')">/</button>
            
            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button onclick="appendOp('*')">*</button>
            
            <button onclick="toggleSign()">+/-</button>
            <button onclick="appendNum('0')">0</button>
            <button onclick="appendOp('-')">-</button>
            <button onclick="appendOp('+')">+</button>
            
            <button onclick="calculate()" style="grid-column: span 4;">=</button>
        </div>

        <div id="engBlock" class="eng-grid">
            <button onclick="calcFunc('sqrt')">√</button>
            <button onclick="calcFunc('pow')">x²</button>
            <button onclick="calcFunc('sin')">sin</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const toggleBtn = document.getElementById('toggleMode');
        const engBlock = document.getElementById('engBlock');
        let isEng = false;

        function appendNum(val) { display.value += val; }
        function appendOp(op) { display.value += op; }
        function clearDisplay() { display.value = ''; }
        
        function toggleSign() {
            if (display.value.startsWith('-')) {
                display.value = display.value.slice(1);
            } else if (display.value !== '') {
                display.value = '-' + display.value;
            }
        }

        function calculate() {
            try { display.value = eval(display.value); } 
            catch { display.value = 'Помилка'; }
        }

        function calcFunc(fn) {
            let val = parseFloat(display.value);
            if (isNaN(val)) return;
            if (fn === 'sqrt') display.value = Math.sqrt(val);
            if (fn === 'pow') display.value = Math.pow(val, 2);
            if (fn === 'sin') display.value = Math.sin(val * Math.PI / 180).toFixed(4);
        }

        toggleBtn.addEventListener('click', () => {
            isEng = !isEng;
            engBlock.style.display = isEng ? 'grid' : 'none';
            toggleBtn.textContent = isEng ? 'Переключити на Простий' : 'Переключити на Інженерний';
        });
    </script>
</body>
</html>
