<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 4</title>
</head>
<body>

    <h3>Завдання 4. Робота з console.log()</h3>

    <script>
        let num1 = 17;
        let num2 = 5;

        let remainder = num1 % num2;
        console.log("Остача від ділення " + num1 + " на " + num2 + " дорівнює: " + remainder);

        let isZero = (num1 % num2) === 0;
        console.log("Чи дорівнює остача від ділення нулю?", isZero);

        let sampleArray = [10, 20, 30];
        console.log("Значення масиву: %d, %d, %d", sampleArray[0], sampleArray[1], sampleArray[2]);
        console.log("Перший елемент масиву як рядок: %s", sampleArray[0]);
    </script>

</body>
</html>
