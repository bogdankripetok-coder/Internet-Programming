        function calculateTask4() {
            let a = parseFloat(document.getElementById("task4_a").value);
            let b = parseFloat(document.getElementById("task4_b").value);
            let c = parseFloat(document.getElementById("task4_c").value);
            let d;

            if (a * b * c > 0) {
                d = a * b - c;
            } else if (a * b * c < 0) {
                d = a - b * c;
            } else {
                d = a * c - Math.sqrt(Math.abs(b));
            }

            document.getElementById("task4_d").value = d;
        }

    
        function calculateTask5() {
            let a = parseFloat(document.getElementById("task5_a").value);
            let b = parseFloat(document.getElementById("task5_b").value);
            let sum = 0.0;
            let i = 0;
            let cur = 0.0;
            let precision = 0.001;

            do {
                i++;
                let factorial = 1;
                for (let j = 1; j <= i; j++) {
                    factorial *= j;
                }
                cur = (2 * a * i * i + i / b) / (factorial * factorial);
                sum += cur;
            } while (cur > precision && i < 100);

            document.getElementById("task5_res").value = sum.toFixed(5);
        }
    </script>

    <h3>Завдання 5 (Варіант 16)</h3>
<script>
    function getFactorial(n) {
        let result = 1;
        for (let k = 1; k <= n; k++) {
            result *= k;
        }
        return result;
    }

    function calculateTask5Variant16() {
        let x = parseFloat(document.getElementById("task5_x").value);
        let y = parseFloat(document.getElementById("task5_y").value);

        if (isNaN(x) || isNaN(y)) {
            alert("введіть числові значення для x та y");
            return;
        }

        let sum = 0;

        for (let i = 2; i <= 7; i++) {
            let iFact = getFactorial(i);          // i!
            let iPlus1Fact = getFactorial(i + 1); // (i + 1)!

            let term = Math.pow(-1, i) * ((iFact - x * y) / iPlus1Fact);
            
            sum += term;
        }

        document.getElementById("task5_res").value = sum.toFixed(5);
    }
</script>
