<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 6</title>
    <script>
        
        let products = ["Book", "Пенал", "Підручник", "Подушка", "Бита"];
        let quantity = [120, 350, 45, 90, 200];
        let cost = [250.00, 15.50, 320.00, 45.00, 10.00];

        
        let selectedIndex = -1;

        function fun1() {
            let inputName = document.form1.name_cont.value.trim().toLowerCase();
            selectedIndex = -1;

            for (let i = 0; i < products.length; i++) {
                if (products[i].toLowerCase() === inputName) {
                    selectedIndex = i;
                    break;
                }
            }

            if (selectedIndex !== -1) {
                document.form1.output_quantity.value = "Кількість на складі: " + quantity[selectedIndex] + " шт.";
                document.form1.output_cost.value = "Вартість за одиницю: " + cost[selectedIndex] + " грн";
                document.form1.output_total.value = ""; 
            } else {
                document.form1.output_quantity.value = "Товар не знайдено!";
                document.form1.output_cost.value = "";
                document.form1.output_total.value = "";
            }
        }

        function fun2() {
            if (selectedIndex !== -1) {
                let total = quantity[selectedIndex] * cost[selectedIndex];
                document.form1.output_total.value = "Загальна вартість товару '" + products[selectedIndex] + "': " + total + " грн";
            } else {
                alert("Спочатку знайдіть товар за допомогою кнопки 'Наявна кількість і вартість'!");
            }
        }
    </script>
</head>
<body>
    <h3>Завдання 6. Пошук товару</h3>
    <form name="form1">
        Введіть назву товару :<br>
        <input type="text" name="name_cont">
        <input type="button" value="Наявна кількість і вартість" onClick="fun1()"><br><br>

        Кількість:<br>
        <input type="text" size="50" name="output_quantity" readonly><br>
        Вартість:<br>
        <input type="text" size="50" name="output_cost" readonly><br><br>

        <input type="button" value="Загальна сума" onClick="fun2()"><br><br>
        Загальний розрахунок:<br>
        <input type="text" size="70" name="output_total" readonly>
    </form>
</body>
</html>
